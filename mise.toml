[tools]
node = "26.10.0"

# The agent bootstrap (pinned skills, MCP registration, Chrome DevTools, Google's web guidance)
# is remy-auth's tasks directory, included by git reference pinned to a commit. Update the ref
# deliberately; MISE_TASK_REMOTE_NO_CACHE=true refreshes mise's cache of it.
[task_config]
includes = ["git::https://github.com/joeblew999/remy-auth.git//tasks?ref=1bb27969fcc5f02352075cd17cdc055185aab1ca"]

[env]
# Inputs for the shared pipeline tasks. Every task comes from remy-auth's include; nothing is
# overridden here. PUBLIC_ORIGIN is the local origin baked into prerendered links for tests;
# cf:deploy builds with DEPLOY_ORIGIN instead.
PREVIEW_PORT = "4174"
PUBLIC_ORIGIN = "http://127.0.0.1:4174"
DEPLOY_ORIGIN = "https://remy-auth-app.gedw99.workers.dev"
