# The included tasks rely on mise 2026.9.12 (task run lists, env templating, include overrides);
# an include cannot set this, so every consumer states it.
min_version = "2026.9.12"

[tools]
node = "26.10.0"

# Every task (pipeline, pinned skills, MCP registration, Chrome DevTools, Google's web guidance,
# agent launchers, Cloudflare) is remy-auth's tasks directory, one file per namespace, included
# by git reference pinned to the release tag that matches @joeblew999/remy-ui in package.json
# (change both together). MISE_ENV=dev uses remy-auth's main (mise.dev.toml); a gitignored
# mise.local.toml can point at a local checkout. See remy-auth's tasks/README.md.
# Every task prints its duration and the entry point prints the total, so slow steps show.
[settings]
task.timings = true

[task_config]
includes = ["git::https://github.com/joeblew999/remy-auth.git//tasks?ref=v0.12.0"]

[env]
# Inputs for the shared pipeline tasks. Every task comes from remy-auth's include; nothing is
# overridden here. PUBLIC_ORIGIN is the local origin baked into prerendered links for tests;
# cf:deploy builds with DEPLOY_ORIGIN instead. A worktree or agent picks its own port from the
# shell (PREVIEW_PORT=4232 mise run project:verify) and PUBLIC_ORIGIN follows it.
PREVIEW_PORT = "{{ get_env(name='PREVIEW_PORT', default='4174') }}"
PUBLIC_ORIGIN = "http://127.0.0.1:{{ env.PREVIEW_PORT }}"
DEPLOY_ORIGIN = "https://remy-auth-app.gedw99.workers.dev"
# remy-auth, whose API (@joeblew999/remy-auth-contract) the status card on /app asks from the
# browser; only the build for DEPLOY_ORIGIN, the origin remy-auth registered, uses it (vite.config.ts).
REMY_AUTH_ORIGIN = "https://remy-auth.gedw99.workers.dev"
